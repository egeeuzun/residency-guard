[project]
name = "residency-guard"
version = "0.1.0"
description = "Istanbul Local Zone veri yerelligi denetimi (salt okunur, boto3)"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
residency-guard = "residency_guard.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["residency_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
